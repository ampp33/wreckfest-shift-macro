# Wreckfest Shift Macro — configuration
#
# Lives next to the plugin as scripts/wreckfest-shift-macro.toml in the
# Wreckfest install folder. The plugin re-reads it automatically within
# about a second of it being saved — no need to restart the game.
#
# Key names use the Linux kernel's KEY_* names (e.g. "KEY_Q", "KEY_F11",
# "KEY_LEFT"), kept from the Linux daemon version of this project. Axis
# names use the ABS_* names (e.g. "ABS_X", "ABS_RY"). See
# src/config/KeyCodes.cpp for the full list.

[controller]
# XInput slot (0-3) the virtual controller occupies. A physical controller
# plugged into the same slot is hidden from the game while the plugin is
# loaded; controllers in other slots work normally.
slot = 0


[mode]
# Driving Mode: bound keys are hidden from the game and drive the virtual
# controller instead, gear shifts going through the full clutch-assisted
# timing sequence. Unbound keys (Esc for the pause menu, etc.) still reach
# the game. Chat Mode: every key goes to the game untouched, for in-game
# chat. Keybinding Mode: like Driving Mode, but every binding fires
# immediately and literally — no clutch pulse/delay on gear shifts, no
# steering ramp — so the game's "press any input" bind-detection sees one
# clean signal per key. Switch into it just long enough to bind your
# controls in-game, then switch back to Driving Mode to actually drive.
# There is no toggle key for any of these — you always know which mode
# you're in from which key you pressed. The hotkeys themselves are never
# passed on to the game.
driving_hotkey = "KEY_F11"
chat_hotkey = "KEY_F12"
keybind_hotkey = "KEY_F10"


[bindings]
# Sequential gear buttons. Pressing a key runs the clutch-assisted engage
# sequence (see [clutch] below) and then holds the gear button down for as
# long as the key is held; releasing the key releases the gear button.
gear1 = "KEY_Q"
gear2 = "KEY_A"
gear3 = "KEY_W"
gear4 = "KEY_S"
gear5 = "KEY_E"
gear6 = "KEY_D"
reverse = "KEY_Z"

# Throttle/brake map to the right/left analog triggers respectively.
# Currently binary (full press or fully released) — see the "throttle and
# brake curves" item in the README's future-expansion section.
throttle = "KEY_UP"
brake = "KEY_DOWN"

# Digital steering, ramped into an analog value — see [steering] below.
steer_left = "KEY_LEFT"
steer_right = "KEY_RIGHT"

handbrake = "KEY_SPACE"

# Manual clutch key: held down, it engages the clutch axis directly for
# as long as it's held — independent of any gear shift, and composes with
# the automatic per-shift pulse below (holding this key keeps the clutch
# engaged straight through any number of gear shifts). Also the easiest
# way to bind the clutch axis in Wreckfest: hold this key while Wreckfest
# is listening for input, since a manual hold isn't time-limited the way
# an automatic shift's clutch pulse is.
clutch = "KEY_LEFTSHIFT"

# Reset/recovery key (e.g. flip the car back over after a crash). Every
# standard controller button is already used by a gear, reverse, or the
# handbrake, and Back/Start/Guide are deliberately left unbound for
# menus/the Steam overlay, so this maps to D-pad Up instead — bind
# Wreckfest's "Reset Vehicle" (or equivalent) control to D-pad Up using
# Keybinding Mode (F10).
reset = "KEY_R"


[clutch]
# Analog clutch-assist automation, applied to every gear change
# (including reverse). Sequence on key-down: clutch axis presses, then
# after press_delay_ms the gear button presses (and stays pressed — it
# only releases when the key is released), then after a further
# release_delay_ms the clutch axis releases (unless [bindings].clutch is
# also being held, in which case the axis stays engaged). See
# ClutchController.h for the full timing diagram, including how a very
# fast tap is unwound.
enabled = true

# Which controller axis acts as the clutch. Xbox controllers have no
# dedicated clutch axis, so this reuses the right stick's Y axis; bind
# ABS_RY to "Clutch" inside Wreckfest's control settings. (In XInput a
# positive right-stick Y value is stick *up*.)
axis = "ABS_RY"

press_value = 32767
release_value = 0

press_delay_ms = 20
release_delay_ms = 20

# How the two delays are counted. "ms" uses press_delay_ms/release_delay_ms
# above. "frames" uses press_delay_frames/release_delay_frames below,
# counted in the game's own controller polls (Wreckfest polls once per
# rendered frame), so exactly which frames see what is fixed: the game
# sees press_delay_frames frames of clutch only, then
# release_delay_frames frames of gear + clutch, then gear only.
# release_delay_frames = 0 means the game never sees the gear and the
# clutch together; press_delay_frames = 0 means they appear in the same
# frame. With [logging] level = "info", every shift logs a
# "Game saw shift to ..." line with what the game actually received.
#
# 0/3 frames is the tested sweet spot: the game only counts the clutch if
# it's engaged in the frame where the gear first appears (a clutch
# released before that is ignored, and pressing it earlier just delays the
# shift), and it has to stay engaged a little while after — 1 frame of
# overlap was often missed, 2 very occasionally, 3 never.
timing = "frames"
press_delay_frames = 0
release_delay_frames = 3


[steering]
# "digital" is currently the only supported mode: steer_left/steer_right
# key presses move the left stick's X axis toward max_value and let it
# return to center when released. (Mouse steering and analog input curves
# are listed under future expansion in the README.)
mode = "digital"
max_value = 32767

# Axis units per second while a steering key is held / while returning to
# center. At the default 32767 max_value, ramp_speed = 5000 means roughly
# 6.5 seconds from center to full lock — tune to taste. Ignored if
# `instant` below is true.
ramp_speed = 5000
return_speed = 5000

# If true, steer_left/steer_right snap the axis straight to +-max_value/0
# instead of ramping — immediate on/off rather than a smoothed analog
# feel. Keybinding Mode always behaves this way regardless of this
# setting, since a game's bind-detection needs an immediate, unambiguous
# signal. Ignored if use_dpad below is true.
instant = true

# If true, steer_left/steer_right drive the D-pad's horizontal axis
# instead of the left stick. Always immediate (the D-pad only has three
# positions: left/center/right, so there's no ramp to apply regardless of
# `instant` above). Worth trying if steering still feels smoothed/gradual
# in-game even with instant = true — many games apply their own
# analog-stick response curve to the left stick no matter how the axis is
# actually driven, and a real hat switch bypasses that. Note this changes
# how you bind steering in Wreckfest: with use_dpad, bind "Steer Left" and
# "Steer Right" to the D-pad's left/right directions (two digital inputs)
# instead of binding "Steering" to one analog stick axis.
use_dpad = true


[logging]
# One of: "error", "warning", "info", "debug".
# "debug" traces every keypress, action dispatch, and clutch/gear state
# transition — verbose, but exactly what you want when diagnosing a
# specific shifting issue. Drop back to "info" for normal use.
level = "info"
